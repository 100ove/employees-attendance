
<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142b4a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="QR Attendance">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./app-icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/100ove/employees-attendance/main/watermarked_img_6493403581545221552%20%282%29.webp">
  <title>QR Attendance Reader | Consumer Services</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    :root {
      color-scheme: light;
      --navy: #142b4a;
      --blue: #2457a7;
      --teal: #0f766e;
      --muted: #64748b;
      --line: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: clamp(14px, 4vw, 34px);
      font-family: Tahoma, Arial, sans-serif;
      color: #1e293b;
      background:
        radial-gradient(ellipse at 12% 8%, rgba(20, 184, 166, .12), transparent 34%),
        radial-gradient(ellipse at 92% 90%, rgba(37, 99, 235, .12), transparent 36%),
        #f3f6fb;
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 520px;
      margin: clamp(12px, 4vh, 42px) auto;
      padding: clamp(22px, 5vw, 34px);
      overflow: hidden;
      background: rgba(255, 255, 255, .97);
      border: 1px solid rgba(226, 232, 240, .95);
      border-top: 5px solid var(--blue);
      border-radius: 26px;
      box-shadow: 0 22px 60px rgba(15, 35, 65, .10), 0 3px 10px rgba(15, 35, 65, .04);
    }

    .container::before {
      content: "";
      position: absolute;
      top: -78px;
      left: -62px;
      width: 190px;
      height: 190px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(20, 184, 166, .10), rgba(37, 99, 235, .04));
      pointer-events: none;
    }


    .company-logo {
      display: block;
      width: min(190px, 55%);
      max-height: 150px;
      object-fit: contain;
      margin: 0 auto 18px;
      border-radius: 14px;
    }

    h2 {
      position: relative;
      margin: 0 0 26px;
      color: var(--navy);
      text-align: center;
      font-size: clamp(22px, 5vw, 27px);
      font-weight: 800;
      letter-spacing: -.5px;
      line-height: 1.6;
    }

    .department {
      margin: -18px 0 24px;
      color: var(--teal);
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      letter-spacing: .4px;
    }

    h2::after {
      content: "";
      display: block;
      width: 58px;
      height: 4px;
      margin: 10px auto 0;
      border-radius: 99px;
      background: linear-gradient(90deg, #14b8a6, #2563eb);
    }

    #reader {
      width: 100%;
      min-height: 245px;
      padding: 10px;
      overflow: hidden;
      border: 1px solid #e2eaf3;
      border-radius: 20px;
      background: linear-gradient(145deg, #f8fafc, #f1f5f9);
    }

    #reader video {
      max-width: 100%;
      border-radius: 14px;
    }

    #reader img {
      border-radius: 10px;
    }

    button {
      width: 100%;
      min-height: 54px;
      margin-top: 18px;
      padding: 15px 20px;
      border: 0;
      border-radius: 15px;
      background: linear-gradient(110deg, #1e40af, #176b78);
      box-shadow: 0 9px 20px rgba(30, 64, 175, .19);
      color: #fff;
      font-family: inherit;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, filter .18s ease;
    }

    button:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 13px 25px rgba(30, 64, 175, .24);
      filter: brightness(1.04);
    }

    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: .65; cursor: wait; }

    .status {
      margin-top: 18px;
      padding: 17px 18px;
      border: 1px solid transparent;
      border-radius: 16px;
      text-align: center;
      line-height: 1.9;
      font-size: 15px;
      font-weight: 600;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .waiting {
      background: #f1f5f9;
      border-color: #e2e8f0;
      color: #475569;
    }

    .success {
      background: #ecfdf5;
      border-color: #a7f3d0;
      color: #047857;
    }

    .error {
      background: #fff1f2;
      border-color: #fecdd3;
      color: #be123c;
    }

    button:focus-visible {
      outline: 3px solid rgba(20, 184, 166, .35);
      outline-offset: 3px;
    }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .container {
        margin: 12px auto;
        padding: 20px 16px;
        border-radius: 22px;
      }
      #reader { min-height: 220px; padding: 7px; }
      .status { padding: 14px 12px; font-size: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      button { transition: none; }
    }
  </style>
</head>

<body>
<div class="container">

  <img class="company-logo" src="https://raw.githubusercontent.com/100ove/employees-attendance/main/watermarked_img_6493403581545221552%20%282%29.webp" alt="Company logo">
  <div class="department">Consumer Services</div>
  <h2>QR Attendance Reader</h2>

  <div id="reader"></div>

  <div id="status" class="status waiting">
    Press Start Camera to begin
  </div>

  <button id="startButton" onclick="startScanner()">
    Start Camera
  </button>

</div>

<script>
  const API_URL =
    'https://script.google.com/macros/s/AKfycbxhkdZTRQ-Kge2RKAuiRjx4ccDuPGnALKq6J8ERfc5JAshIa-QIIGx77M7DAxFvUba2/exec';

  let scanner = null;
  let processing = false;
  let lastCode = '';
  let lastTime = 0;

  function showStatus(type, message) {
    const box = document.getElementById('status');
    box.className = 'status ' + type;
    box.textContent = message;
  }

  async function startScanner() {
    const button = document.getElementById('startButton');

    if (typeof Html5Qrcode === 'undefined') {
      showStatus('error', 'Unable to load the QR scanner library. Check your internet connection.');
      return;
    }

    button.disabled = true;
    button.textContent = 'Starting camera...';

    try {
      scanner = new Html5Qrcode('reader');

      await scanner.start(
        { facingMode: 'environment' },
        {
          fps: 10,
          qrbox: { width: 250, height: 250 }
        },
        onScanSuccess
      );

      showStatus('success', 'Camera is active. Point it at the employee QR code.');
      button.style.display = 'none';

    } catch (error) {
      scanner = null;
      button.disabled = false;
      button.textContent = 'Restart Camera';

      showStatus(
        'error',
        'Unable to start the camera:\n' +
        (error.message || String(error))
      );
    }
  }

  function onScanSuccess(decodedText) {
    const now = Date.now();

    if (processing) return;
    if (decodedText === lastCode && now - lastTime < 3000) return;

    processing = true;
    lastCode = decodedText;
    lastTime = now;

    showStatus('waiting', 'Code scanned. Recording attendance...');

    const callbackName =
      'attendanceCallback_' + Date.now() + '_' +
      Math.floor(Math.random() * 100000);

    const script = document.createElement('script');

    const timeout = setTimeout(function() {
      cleanup();
      showStatus('error', 'Connection timed out. Please try again.');
      processing = false;
    }, 15000);

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];
      script.remove();
    }

    window[callbackName] = function(result) {
      cleanup();

      if (result && result.ok) {
        const message =
          (result.duplicate
            ? 'Attendance already recorded'
            : 'تم تسجيل الحضور') +
          '\nEmployee name: ' + result.name +
          '\nEmployee ID: ' + result.employeeID +
          '\nArrival time: ' + result.arrivalTime +
          '\nStatus: ' + result.status;

        showStatus(
          result.duplicate ? 'waiting' : 'success',
          message
        );
      } else {
        showStatus(
          'error',
          result && result.message
            ? result.message
            : 'Unable to record attendance'
        );
      }

      setTimeout(function() {
        processing = false;
      }, 1500);
    };

    script.onerror = function() {
      cleanup();
      showStatus('error', 'Unable to connect to the attendance service.');
      processing = false;
    };

    script.src =
      API_URL +
      '?action=scan' +
      '&token=' + encodeURIComponent(decodedText) +
      '&callback=' + encodeURIComponent(callbackName);

    document.body.appendChild(script);
  }
</script>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./service-worker.js').catch(function (error) {
        console.warn('تعذر تسجيل service worker:', error);
      });
    });
  }
</script>

</body>
</html>
